[workspace]

[package]
name = "blocksign-mcp-server"
version = "0.0.1"
edition = "2021"
rust-version = "1.82"

[[bin]]
name = "blocksign-mcp-server"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
tokio = { version = "1.41", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

axum = { version = "0.7", features = ["macros", "multipart"] }
tower = { version = "0.5", features = ["util", "timeout", "limit"] }
tower-http = { version = "0.6", features = ["trace", "cors", "compression-gzip", "request-id", "sensitive-headers", "limit"] }
http = "1.1"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

thiserror = "1.0"
anyhow = "1.0"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "multipart"], default-features = false }
figment = { version = "0.10", features = ["env", "toml"] }
url = "2.5"
uuid = { version = "1.11", features = ["v4", "v7", "serde"] }

[dev-dependencies]
tokio = { version = "1.41", features = ["macros", "rt-multi-thread", "test-util"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
